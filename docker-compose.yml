services:
  web:
    build: .
    cpus: 0.5
    mem_limit: 512m
    # Values come from the RepoRun UI; listing a name without a value passes it through.
    environment:
      - SECRET_KEY
      - ALLOWED_HOSTS
      - CSRF_TRUSTED_ORIGINS
      - HTTPS_ENABLED
      - DJANGO_SUPERUSER_USERNAME
      - DJANGO_SUPERUSER_EMAIL
      - DJANGO_SUPERUSER_PASSWORD
      - EMAIL_HOST
      - EMAIL_PORT
      - EMAIL_HOST_USER
      - EMAIL_HOST_PASSWORD
      - CONTACT_NOTIFY_EMAIL
      - DEFAULT_FROM_EMAIL
    volumes:
      - .stack-data/db:/data
