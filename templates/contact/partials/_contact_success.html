{% load i18n %}
<div class="text-center py-5" role="status" aria-live="polite">
  <div class="d-inline-flex align-items-center justify-content-center mb-4"
       style="width:72px;height:72px;border-radius:50%;background:var(--forge-lime)">
    <i class="bi bi-check-lg fs-1" style="color:var(--forge-black)" aria-hidden="true"></i>
  </div>

  <h2 class="h4 mb-3" style="font-family:var(--bs-body-font-family);font-weight:700;text-transform:none">
    {% trans "Message sent" %}
  </h2>

  <p class="text-muted mb-4 mx-auto" style="max-width:28rem">{{ success_message }}</p>
  <a class="btn btn-outline-dark" href="{% url 'core:home' %}">{% trans "Back to homepage" %}</a>
</div>
