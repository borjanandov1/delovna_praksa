{% load i18n %}
<header class="section-dark section-tight">
  <div class="container">
    {% if crumbs %}
      <nav aria-label="{% trans 'Breadcrumb' %}" class="mb-3">
        <ol class="breadcrumb mb-0" style="--bs-breadcrumb-divider:'/';font-size:.8125rem">
          <li class="breadcrumb-item"><a href="{% url 'core:home' %}" class="text-white-50">{% trans "Home" %}</a></li>
          {% for c in crumbs %}
            {% if c.url %}
              <li class="breadcrumb-item"><a href="{{ c.url }}" class="text-white-50">{{ c.label }}</a></li>
            {% else %}
              <li class="breadcrumb-item active text-white" aria-current="page">{{ c.label }}</li>
            {% endif %}
          {% endfor %}
        </ol>
      </nav>
    {% endif %}

    {% if eyebrow %}<span class="eyebrow eyebrow-light">{{ eyebrow }}</span>{% endif %}
    <h1 class="mb-0">{{ heading }}</h1>
    {% if sub %}<p class="lead mt-3 mb-0" style="max-width:44rem">{{ sub }}</p>{% endif %}
  </div>
</header>
