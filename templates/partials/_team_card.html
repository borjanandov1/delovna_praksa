{% load i18n %}
{# Expects: member #}
<article class="card-forge position-relative reveal">
  {% if member.photo %}
    <img class="team-photo" src="{{ member.photo.url }}" alt="{{ member.name }}"
         width="450" height="600" loading="lazy" decoding="async">
  {% else %}
    <div class="team-photo d-flex align-items-center justify-content-center bg-light text-muted">
      <i class="bi bi-person fs-1" aria-hidden="true"></i>
    </div>
  {% endif %}

  <div class="p-4">
    <h3 class="h5 mb-1" style="font-family:var(--bs-body-font-family);font-weight:700;text-transform:none">
      <a href="{{ member.get_absolute_url }}" class="stretch-link text-decoration-none text-reset">
        {{ member.name }}
      </a>
    </h3>
    <p class="small mb-2" style="color:var(--forge-lime-dark);font-weight:600">{{ member.role }}</p>
    {% if member.short_bio %}
      <p class="text-muted small mb-0">{{ member.short_bio }}</p>
    {% endif %}
  </div>
</article>
